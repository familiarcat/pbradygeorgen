version: '3.8'

services:
  # Next.js Application
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - N8N_BASE_URL=https://n8n.pbradygeorgen.com
      - N8N_API_KEY=${N8N_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - app-network
  # Optional: Local n8n for testing (commented out - using deployed instance)
  # n8n-local:
  #   image: n8nio/n8n:latest
  #   ports:
  #     - "5678:5678"
  #   environment:
  #     - N8N_HOST=localhost
  #     - N8N_PORT=5678
  #     - N8N_PROTOCOL=http
  #     - WEBHOOK_URL=http://localhost:5678
  #   volumes:
  #     - n8n_data:/home/node/.n8n
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

volumes:
  n8n_data:
